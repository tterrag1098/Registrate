name: Build

on: [workflow_dispatch, push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true

      - name: NeoGradle Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/repositories/"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify
        run: ./gradlew --no-daemon --stacktrace build

      - name: Verify Generated Resources
        run: |
          ./gradlew --no-daemon runClientData
          changes="$(git status --porcelain --untracked-files=all -- src/generated/resources)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/generated/resources
            exit 1
          fi

      - name: Run GameTests
        run: ./gradlew --no-daemon runGameTestServer
